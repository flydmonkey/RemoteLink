<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RemoteLink · 用户管理</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          14px/1.45 "Segoe UI Variable",
          "Segoe UI",
          "Microsoft YaHei UI",
          sans-serif;
        --bg: #202020;
        --panel: #2b2b2b;
        --control: #222;
        --line: #ffffff20;
        --text: #f5f5f5;
        --muted: #ffffff92;
        --accent: #6cc5f3;
        --accent-text: #10232d;
        --danger: #ff99a4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 28px 16px;
        color: var(--text);
        background: var(--bg);
      }
      button,
      input {
        font: inherit;
      }
      .app {
        width: min(980px, 100%);
        margin: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 18px 50px #0006;
        overflow: hidden;
      }
      .bar {
        height: 52px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
      }
      .back {
        color: var(--text);
        font-size: 22px;
        text-decoration: none;
      }
      .bar h1 {
        font-size: 14px;
      }
      .bar .primary {
        margin-left: auto;
      }
      .content {
        padding: 24px;
      }
      .head h2 {
        margin: 0;
        font-size: 22px;
      }
      .head p {
        margin: 4px 0 18px;
        color: var(--muted);
      }
      .list {
        border: 1px solid var(--line);
        border-radius: 7px;
        overflow: hidden;
      }
      .row {
        display: grid;
        grid-template-columns: minmax(150px, 1fr) minmax(130px, 1fr) 80px auto;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }
      .row:last-child {
        border-bottom: 0;
      }
      .muted {
        color: var(--muted);
        font-size: 12px;
      }
      .state.enabled {
        color: #83d47b;
      }
      .actions {
        display: flex;
        gap: 5px;
        justify-content: flex-end;
        flex-wrap: nowrap;
      }
      .primary,
      .secondary,
      .danger {
        min-height: 32px;
        padding: 5px 9px;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--text);
        background: #363636;
        cursor: pointer;
        white-space: nowrap;
        font-size: 12px;
      }
      .primary {
        border: 0;
        color: var(--accent-text);
        background: var(--accent);
        font-weight: 600;
      }
      .danger {
        color: var(--danger);
      }
      .notice {
        min-height: 20px;
        color: var(--danger);
      }
      dialog {
        width: min(520px, calc(100% - 32px));
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
        background: var(--panel);
      }
      dialog form {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 12px;
        align-items: center;
      }
      dialog h2,
      .dialog-actions,
      .dialog-notice,
      .permission-groups {
        grid-column: 1/-1;
      }
      dialog h2 {
        margin: 0 0 4px;
      }
      input {
        min-height: 34px;
        padding: 6px 9px;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--text);
        background: var(--control);
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .permission-groups {
        display: grid;
        gap: 12px;
      }
      .permission-group {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .permission-group h3 {
        margin: 0 0 8px;
        font-size: 13px;
      }
      .checks {
        display: grid;
        gap: 7px;
      }
      .checks label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }
      .checks input {
        width: 17px;
        min-height: 17px;
      }
      .empty {
        padding: 16px;
        color: var(--muted);
        text-align: center;
      }
      @media (max-width: 760px) {
        body {
          padding: 0;
        }
        .app {
          min-height: 100vh;
          border: 0;
        }
        .content {
          padding: 18px 14px;
        }
        .row {
          grid-template-columns: 1fr;
        }
        .actions {
          justify-content: flex-start;
          flex-wrap: wrap;
        }
        dialog form {
          grid-template-columns: 1fr;
        }
        dialog h2,
        .dialog-actions,
        .dialog-notice,
        .permission-groups {
          grid-column: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <a class="back" href="/" aria-label="返回">‹</a>
        <h1>用户管理</h1>
        <button class="primary" id="add">添加用户</button>
      </header>
      <main class="content">
        <div class="head">
          <h2>用户</h2>
          <p>管理账号并统一配置 RDP、VNC 和 SSH 连接授权。</p>
        </div>
        <div id="notice" class="notice"></div>
        <div id="list" class="list"></div>
      </main>
    </div>
    <dialog id="editor">
      <form id="editor-form">
        <h2 id="editor-title">添加用户</h2>
        <label for="name">显示名称</label
        ><input id="name" maxlength="64" required /><label for="username"
          >用户名</label
        ><input id="username" minlength="2" maxlength="64" required /><label
          id="password-label"
          for="password"
          >初始密码</label
        ><input id="password" type="password" minlength="4" maxlength="256" />
        <div id="editor-notice" class="dialog-notice notice"></div>
        <div class="dialog-actions">
          <button class="secondary" id="editor-cancel" type="button">
            取消</button
          ><button class="primary">保存</button>
        </div>
      </form>
    </dialog>
    <dialog id="reset">
      <form id="reset-form">
        <h2>重置密码</h2>
        <label for="new-password">新密码</label
        ><input
          id="new-password"
          type="password"
          minlength="4"
          maxlength="256"
          required
        />
        <div id="reset-notice" class="dialog-notice notice"></div>
        <div class="dialog-actions">
          <button class="secondary" id="reset-cancel" type="button">取消</button
          ><button class="primary">重置密码</button>
        </div>
      </form>
    </dialog>
    <dialog id="permissions">
      <form id="permission-form">
        <h2 id="permission-title">连接授权</h2>
        <div class="permission-groups">
          <section class="permission-group">
            <h3>RDP</h3>
            <div class="checks" id="rdp-checks"></div>
          </section>
          <section class="permission-group">
            <h3>VNC</h3>
            <div class="checks" id="vnc-checks"></div>
          </section>
          <section class="permission-group">
            <h3>SSH</h3>
            <div class="checks" id="ssh-checks">
              <div class="muted">暂无 SSH 连接</div>
            </div>
          </section>
        </div>
        <div id="permission-notice" class="dialog-notice notice"></div>
        <div class="dialog-actions">
          <button class="secondary" id="permission-cancel" type="button">
            取消</button
          ><button class="primary">保存授权</button>
        </div>
      </form>
    </dialog>
    <script>
      const token = sessionStorage.getItem("remote-gateway-access-token") || "",
        list = document.querySelector("#list"),
        notice = document.querySelector("#notice"),
        editor = document.querySelector("#editor"),
        reset = document.querySelector("#reset"),
        permissions = document.querySelector("#permissions");
      let users = [],
        rdpTargets = [],
        vncTargets = [],
        sshTargets = [],
        editing = null,
        resetting = null,
        permissionUser = null;
      async function api(path, options = {}) {
        const response = await fetch(path, {
            ...options,
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
            },
          }),
          data = await response.json();
        if (response.status === 401 || response.status === 403) {
          location.href = "/";
          throw new Error("unauthorized");
        }
        if (!response.ok)
          throw new Error(data.error || `HTTP ${response.status}`);
        return data;
      }
      function render() {
        list.replaceChildren();
        for (const user of users) {
          const row = document.createElement("div"),
            identity = document.createElement("div"),
            username = document.createElement("div"),
            state = document.createElement("div"),
            actions = document.createElement("div");
          row.className = "row";
          identity.innerHTML = '<strong></strong><div class="muted"></div>';
          identity.children[0].textContent = user.name;
          identity.children[1].textContent = user.admin
            ? "主管理员"
            : "普通用户";
          username.textContent = user.username;
          state.className = `state ${user.enabled ? "enabled" : "muted"}`;
          state.textContent = user.enabled ? "已启用" : "已冻结";
          actions.className = "actions";
          const edit = action("编辑", () => openEditor(user)),
            password = action("重置密码", () => openReset(user));
          actions.append(edit, password);
          if (!user.admin) {
            actions.prepend(action("授权", () => openPermissions(user)));
            const toggle = action(
              user.enabled ? "冻结" : "启用",
              () => toggleUser(user),
              user.enabled ? "danger" : "primary",
            );
            actions.append(toggle);
          }
          row.append(identity, username, state, actions);
          list.append(row);
        }
        if (!users.length)
          list.innerHTML = '<div class="empty">尚无用户。</div>';
      }
      function action(text, handler, className = "secondary") {
        const button = document.createElement("button");
        button.className = className;
        button.textContent = text;
        button.onclick = handler;
        return button;
      }
      async function refresh() {
        const [userData, rdpData, vncData, sshData] = await Promise.all([
          api("/api/admin/users"),
          api("/api/admin/state"),
          api("/api/admin/vnc"),
          api("/api/admin/ssh"),
        ]);
        users = userData.items || [];
        rdpTargets = (rdpData.targets || []).filter((item) => item.managed);
        vncTargets = vncData.connections || [];
        sshTargets = sshData.connections || [];
        render();
      }
      function openEditor(user = null) {
        editing = user;
        document.querySelector("#editor-title").textContent = user
          ? "编辑用户"
          : "添加用户";
        document.querySelector("#name").value = user?.name || "";
        document.querySelector("#username").value = user?.username || "";
        const password = document.querySelector("#password"),
          label = document.querySelector("#password-label");
        password.value = "";
        password.required = !user;
        password.hidden = !!user;
        label.hidden = !!user;
        editor.showModal();
      }
      function openReset(user) {
        resetting = user;
        document.querySelector("#reset-form").reset();
        reset.showModal();
      }
      function fillChecks(root, targets, user) {
        root.replaceChildren();
        for (const target of targets) {
          const label = document.createElement("label"),
            input = document.createElement("input");
          input.type = "checkbox";
          input.value = target.id;
          input.checked = (user.allowedTargets || []).includes(target.id);
          label.append(input, target.name);
          root.append(label);
        }
        if (!targets.length)
          root.innerHTML = '<div class="muted">暂无连接</div>';
      }
      function openPermissions(user) {
        permissionUser = user;
        document.querySelector("#permission-title").textContent =
          `连接授权 · ${user.name}`;
        fillChecks(document.querySelector("#rdp-checks"), rdpTargets, user);
        fillChecks(document.querySelector("#vnc-checks"), vncTargets, user);
        fillChecks(document.querySelector("#ssh-checks"), sshTargets, user);
        document.querySelector("#permission-notice").textContent = "";
        permissions.showModal();
      }
      async function toggleUser(user) {
        await api("/api/admin/users/toggle", {
          method: "POST",
          body: JSON.stringify({ id: user.id, enabled: !user.enabled }),
        });
        await refresh();
      }
      document.querySelector("#add").onclick = () => openEditor();
      document.querySelector("#editor-cancel").onclick = () => editor.close();
      document.querySelector("#reset-cancel").onclick = () => reset.close();
      document.querySelector("#permission-cancel").onclick = () =>
        permissions.close();
      document.querySelector("#editor-form").onsubmit = async (event) => {
        event.preventDefault();
        const payload = {
          id: editing?.id,
          name: document.querySelector("#name").value.trim(),
          username: document.querySelector("#username").value.trim(),
        };
        if (!editing)
          payload.password = document.querySelector("#password").value;
        try {
          await api(
            editing ? "/api/admin/users/update" : "/api/admin/users/create",
            { method: "POST", body: JSON.stringify(payload) },
          );
          editor.close();
          await refresh();
        } catch (error) {
          document.querySelector("#editor-notice").textContent = error.message;
        }
      };
      document.querySelector("#reset-form").onsubmit = async (event) => {
        event.preventDefault();
        try {
          await api("/api/admin/users/rotate", {
            method: "POST",
            body: JSON.stringify({
              id: resetting.id,
              password: document.querySelector("#new-password").value,
            }),
          });
          reset.close();
          await refresh();
        } catch (error) {
          document.querySelector("#reset-notice").textContent = error.message;
        }
      };
      document.querySelector("#permission-form").onsubmit = async (event) => {
        event.preventDefault();
        const targetIds = [
          ...permissions.querySelectorAll(".checks input:checked"),
        ].map((input) => input.value);
        try {
          await api("/api/admin/users/permissions", {
            method: "POST",
            body: JSON.stringify({ id: permissionUser.id, targetIds }),
          });
          permissions.close();
          await refresh();
        } catch (error) {
          document.querySelector("#permission-notice").textContent =
            error.message;
        }
      };
      refresh().catch((error) => {
        if (error.message !== "unauthorized")
          notice.textContent = error.message;
      });
    </script>
  </body>
</html>
