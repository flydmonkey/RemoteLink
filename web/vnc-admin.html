<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RemoteLink · VNC 管理</title><style>:root{color-scheme:dark;--bg:#202020;--panel:#2b2b2b;--control:#222;--line:#ffffff18;--text:#f5f5f5;--muted:#ffffff92;--accent:#6cc5f3;--accent-text:#10232d;--danger:#ff99a4;font:14px/1.45 "Segoe UI Variable","Segoe UI","Microsoft YaHei UI",sans-serif}*{box-sizing:border-box}body{margin:0;padding:28px 16px;color:var(--text);background:var(--bg)}button,input,select{font:inherit}.app{width:min(980px,100%);margin:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:0 18px 50px #0006}.bar{height:52px;display:flex;align-items:center;gap:12px;padding:0 14px}.back{color:var(--text);text-decoration:none;font-size:22px}.bar h1{font-size:14px}.content{padding:8px 20px 24px}.section{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:7px;background:#292929}.section-head{display:flex;justify-content:space-between;margin-bottom:12px}.section h2{margin:0;font-size:15px}.primary,.secondary,.danger{min-height:32px;padding:5px 12px;border:1px solid var(--line);border-radius:4px;color:var(--text);background:#363636;cursor:pointer}.primary{border:0;color:var(--accent-text);background:var(--accent);font-weight:600}.danger{color:var(--danger)}.row{display:grid;grid-template-columns:1.4fr 1fr 70px 150px;align-items:center;gap:12px;padding:10px;border-top:1px solid var(--line)}.muted{color:var(--muted);font-size:12px}.actions{display:flex;justify-content:flex-end;gap:6px}.user{display:grid;grid-template-columns:160px 1fr auto;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.checks{display:flex;flex-wrap:wrap;gap:8px 14px}.checks label{color:var(--muted)}dialog{width:min(460px,calc(100% - 32px));padding:20px;border:1px solid var(--line);border-radius:8px;color:var(--text);background:var(--panel)}form{display:grid;grid-template-columns:110px 1fr;gap:12px}form h2,.dialog-actions{grid-column:1/-1}input,select{min-height:34px;padding:6px 9px;border:1px solid #ffffff28;border-radius:4px;color:var(--text);background:var(--control)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}.notice{min-height:20px;color:var(--danger);font-size:12px}@media(max-width:650px){body{padding:0}.app{min-height:100vh;border:0}.content{padding:8px 12px}.row,.user{grid-template-columns:1fr}.actions{justify-content:start}form{grid-template-columns:1fr}form h2,.dialog-actions{grid-column:1}}</style></head><body><div class="app"><header class="bar"><a class="back" href="/vnc">‹</a><h1>VNC 管理</h1></header><main class="content"><div id="notice" class="notice"></div><section class="section"><div class="section-head"><h2>VNC 连接</h2><button class="primary" id="add">添加连接</button></div><div id="connections"></div></section><section class="section"><div class="section-head"><h2>用户授权</h2></div><div id="permissions"></div></section></main></div><dialog id="editor"><form id="form"><h2 id="editor-title">添加 VNC 连接</h2><label>名称</label><input id="name" required><label>主机</label><input id="host" required><label>端口</label><input id="port" type="number" min="1" max="65535" value="5900" required><label>密码</label><input id="password" type="password"><label>访问模式</label><select id="view-only"><option value="false">允许控制</option><option value="true">只读</option></select><div class="dialog-actions"><button class="secondary" id="cancel" type="button">取消</button><button class="primary">保存</button></div></form></dialog><script>
const token=sessionStorage.getItem('remote-gateway-access-token')||'',notice=document.querySelector('#notice');let connections=[],users=[],editing='';async function api(path,options={}){const response=await fetch(path,{...options,headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'}});if(response.status===401||response.status===403){location.href='/';throw new Error('unauthorized')}const data=await response.json();if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);return data}function renderConnections(){const root=document.querySelector('#connections');root.replaceChildren();for(const item of connections){const row=document.createElement('div');row.className='row';row.innerHTML='<div><strong></strong></div><div class="muted address"></div><div class="muted mode"></div><div class="actions"><button class="secondary edit">编辑</button><button class="danger delete">删除</button></div>';row.querySelector('strong').textContent=item.name;row.querySelector('.address').textContent=`${item.host}:${item.port}`;row.querySelector('.mode').textContent=item.viewOnly?'只读':'控制';row.querySelector('.edit').onclick=()=>openEditor(item);row.querySelector('.delete').onclick=()=>remove(item);root.append(row)}if(!connections.length)root.innerHTML='<div class="muted">尚未配置 VNC 连接。</div>'}function renderPermissions(){const root=document.querySelector('#permissions');root.replaceChildren();for(const user of users.filter(item=>!item.admin)){const row=document.createElement('div');row.className='user';const name=document.createElement('strong');name.textContent=user.name||user.username;const checks=document.createElement('div');checks.className='checks';for(const target of connections){const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=user.allowedTargets.includes(target.id);input.dataset.id=target.id;label.append(input,` ${target.name}`);checks.append(label)}const save=document.createElement('button');save.className='primary';save.textContent='保存授权';save.onclick=()=>savePermissions(user,checks);row.append(name,checks,save);root.append(row)}if(!users.filter(item=>!item.admin).length)root.innerHTML='<div class="muted">尚无普通用户。</div>'}function openEditor(item){editing=item?.id||'';document.querySelector('#editor-title').textContent=item?'编辑 VNC 连接':'添加 VNC 连接';for(const key of ['name','host','port'])document.querySelector(`#${key}`).value=item?.[key]??(key==='port'?5900:'');document.querySelector('#password').value='';document.querySelector('#view-only').value=String(!!item?.viewOnly);document.querySelector('#editor').showModal()}async function refresh(){const [vnc,userData]=await Promise.all([api('/api/admin/vnc'),api('/api/admin/users')]);connections=vnc.connections||[];users=userData.items||[];renderConnections();renderPermissions()}async function remove(item){if(!confirm(`删除“${item.name}”？`))return;await api('/api/admin/vnc/delete',{method:'POST',body:JSON.stringify({id:item.id})});await refresh()}async function savePermissions(user,root){const vncIds=new Set(connections.map(item=>item.id)),kept=user.allowedTargets.filter(id=>!vncIds.has(id)),selected=[...root.querySelectorAll('input:checked')].map(input=>input.dataset.id);await api('/api/admin/users/permissions',{method:'POST',body:JSON.stringify({id:user.id,targetIds:[...kept,...selected]})});notice.textContent='授权已保存';await refresh()}document.querySelector('#add').onclick=()=>openEditor();document.querySelector('#cancel').onclick=()=>document.querySelector('#editor').close();document.querySelector('#form').onsubmit=async event=>{event.preventDefault();await api('/api/admin/vnc/save',{method:'POST',body:JSON.stringify({id:editing,name:document.querySelector('#name').value,host:document.querySelector('#host').value,port:Number(document.querySelector('#port').value),password:document.querySelector('#password').value,viewOnly:document.querySelector('#view-only').value==='true'})});document.querySelector('#editor').close();await refresh()};refresh().catch(error=>notice.textContent=error.message);
</script><style>main .section:nth-of-type(2){display:none!important}</style></body></html>
