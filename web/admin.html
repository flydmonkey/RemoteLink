    const selectedTheme=localStorage.getItem('remote-gateway-theme')||'system';document.documentElement.dataset.theme=selectedTheme==='system'?'':selectedTheme;
    async function api(path,options={}){const response=await fetch(path,{...options,headers:{Authorization:`Bearer ${accessToken}`,'Content-Type':'application/json',...(options.headers||{})}});if(response.status===401)throw new Error('unauthorized');const data=await response.json();if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);return data}
    function render(data){targets.setAttribute('aria-busy','false');document.querySelector('#service').textContent=data.status==='ok'?'在线':'异常';document.querySelector('#sessions').textContent=number(data.sessions);document.querySelector('#peers').textContent=number(data.peers);document.querySelector('#frames').textContent=number(data.encodedFrames);document.querySelector('#traffic').textContent=bytes(data.sentBytes);document.querySelector('#drops').textContent=number(data.droppedFrames);document.querySelector('#updated').textContent=`更新于 ${new Date().toLocaleTimeString('zh-CN',{hour12:false})}`;targets.replaceChildren();if(!data.targets.length)targets.innerHTML='<div class="empty">尚未配置目标主机。请在服务端添加目标后重试。</div>';for(const target of data.targets){const row=document.createElement('article');row.className=`target ${target.busy?'busy':''}`;const identity=document.createElement('div');identity.innerHTML='<div class="target-name"></div><div class="secondary"></div>';identity.children[0].textContent=target.name;identity.children[1].textContent=target.id;const address=document.createElement('div');address.innerHTML='<div></div><div class="secondary"></div>';address.children[0].textContent=target.host;address.children[1].textContent=target.username;const state=document.createElement('div');state.className='state';state.innerHTML=`<span class="dot"></span><span>${target.busy?(stateLabels[target.state]||target.state||'占用'):'空闲'}</span>`;const metrics=document.createElement('div');metrics.className='secondary metric-line';metrics.textContent=target.busy?`${duration(target.connectedSeconds)} · ${number(target.encodedFrames)} 帧 · ${bytes(target.sentBytes)}`:`${target.width}×${target.height}`;const action=document.createElement('div');if(target.busy){const button=document.createElement('button');button.className='disconnect';button.textContent='断开会话';button.addEventListener('click',()=>disconnect(target,button));action.append(button)}row.append(identity,address,state,metrics,action);targets.append(row)}renderEvents(data.events||[])}
    function renderEvents(items){const eventList=document.querySelector('#events');eventList.replaceChildren();if(!items.length){eventList.innerHTML='<div class="empty">暂无活动记录。</div>';return}const labels={started:'会话创建',stopped:'会话结束',state:'状态变化',rejected:'连接拒绝','admin-disconnect':'管理操作'};for(const item of items.slice(0,30)){const row=document.createElement('div');row.className='event';const time=document.createElement('time');time.dateTime=new Date(item.timestampMs).toISOString();time.textContent=new Date(item.timestampMs).toLocaleTimeString('zh-CN',{hour12:false});const type=document.createElement('div');type.className=`event-type ${item.type}`;type.textContent=labels[item.type]||item.type;const peer=document.createElement('div');peer.className='event-peer';peer.textContent=`${item.targetId||'—'} / ${item.peerId||'—'}`;const message=document.createElement('div');message.className='event-message';message.textContent=stateLabels[item.message]||item.message;row.append(time,type,peer,message);eventList.append(row)}}
    async function refreshUsers(){try{const data=await api('/api/admin/users');userNotice.textContent='';userList.replaceChildren();for(const user of data.items){const row=document.createElement('div');row.className='user-row';const identity=document.createElement('div');identity.innerHTML='<div class="target-name"></div><div class="secondary"></div>';identity.children[0].textContent=user.name;identity.children[1].textContent=user.username;const state=document.createElement('div');state.className=user.enabled?'live':'secondary';state.textContent=user.enabled?'已启用':'已停用';const actions=document.createElement('div');actions.className='user-actions';if(!user.admin){const toggle=document.createElement('button');toggle.className='small-button';toggle.textContent=user.enabled?'停用':'启用';toggle.addEventListener('click',()=>changeUser('/api/admin/users/toggle',{id:user.id,enabled:!user.enabled}));actions.append(toggle)}const reset=document.createElement('button');reset.className='small-button';reset.textContent='重置密码';reset.addEventListener('click',async()=>{const password=prompt(`为“${user.name}”设置新密码（至少 4 个字符）`);if(password)await changeUser('/api/admin/users/rotate',{id:user.id,password})});actions.append(reset);row.append(identity,state,actions);userList.append(row)}}catch(error){document.querySelector('#users').hidden=error.message==='primary administrator required';if(error.message!=='primary administrator required')userNotice.textContent=`用户读取失败：${error.message}`}}
    async function changeUser(path,payload){try{await api(path,{method:'POST',body:JSON.stringify(payload)});await refreshUsers()}catch(error){userNotice.textContent=`操作失败：${error.message}`}}
    document.querySelector('#create-user').addEventListener('click',()=>{document.querySelector('#user-form').reset();document.querySelector('#user-error').textContent='';userDialog.showModal()});document.querySelector('#cancel-user').addEventListener('click',()=>userDialog.close());document.querySelector('#user-form').addEventListener('submit',async event=>{event.preventDefault();try{await api('/api/admin/users/create',{method:'POST',body:JSON.stringify({name:document.querySelector('#user-name').value,username:document.querySelector('#user-username').value,password:document.querySelector('#user-password').value})});userDialog.close();await refreshUsers()}catch(error){document.querySelector('#user-error').textContent=error.message}});
    async function refresh(){try{render(await api('/api/admin/state'));notice.replaceChildren()}catch(error){if(error.message==='unauthorized'){accessToken='';sessionStorage.removeItem('remote-gateway-access-token');clearInterval(refreshTimer);loginError.textContent='访问令牌已失效，请重新输入';login.showModal()}else{notice.replaceChildren(document.createTextNode(`状态刷新失败：${error.message}`));const retry=document.createElement('button');retry.className='retry';retry.textContent='重试';retry.addEventListener('click',refresh);notice.append(retry);document.querySelector('#service').textContent='不可用'}}}
    async function disconnect(target,button){if(!confirm(`确定断开“${target.name}”的当前远程会话？`))return;button.disabled=true;notice.textContent=`正在断开 ${target.name}…`;try{await api('/api/admin/disconnect',{method:'POST',body:JSON.stringify({peerId:target.peerId})});await new Promise(resolve=>setTimeout(resolve,400));await refresh()}catch(error){notice.textContent=`断开失败：${error.message}`;button.disabled=false}}
    loginForm.addEventListener('submit',async event=>{event.preventDefault();loginError.textContent='';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:loginUsername.value,password:loginPassword.value})});if(!response.ok)throw new Error('unauthorized');accessToken=(await response.json()).token;render(await api('/api/admin/state'));sessionStorage.setItem('remote-gateway-access-token',accessToken);login.close();loginPassword.value='';await refreshUsers();clearInterval(refreshTimer);refreshTimer=setInterval(refresh,2000)}catch(error){loginError.textContent=error.message==='unauthorized'?'用户名或密码不正确':`无法连接：${error.message}`}});
    accessToken=sessionStorage.getItem('remote-gateway-access-token')||'';
    document.querySelector('#admin-logout').addEventListener('click',()=>{sessionStorage.removeItem('remote-gateway-access-token');sessionStorage.removeItem('remote-gateway-session');location.href='/'});
    if(accessToken){refresh();refreshUsers();refreshTimer=setInterval(refresh,2000)}else login.showModal();
  </script>
</body></html>
