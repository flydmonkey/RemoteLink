<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RemoteLink · 连接</title>
  <link rel="icon" type="image/png" href="/remotelink-icon.png">
  <style>
    :root{color-scheme:light;font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI",sans-serif;--mica:#f3f3f3;--layer:#fff;--stroke:#0000001a;--stroke-strong:#0000002e;--text:#1a1a1a;--muted:#0009;--accent:#005fb8;--accent-hover:#196fc2;--accent-text:#fff;--danger:#c42b1c;--control:#ffffffb8;--glow:#d7effb}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--mica:#202020;--layer:#2b2b2b;--stroke:#ffffff16;--stroke-strong:#ffffff2b;--text:#fff;--muted:#ffffff9a;--accent:#60cdff;--accent-hover:#77d5fa;--accent-text:#003447;--danger:#ff99a4;--control:#ffffff0f;--glow:#16445c}}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 78% -20%,var(--glow),transparent 45%),var(--mica);font:14px/1.45 "Segoe UI Variable","Segoe UI","Microsoft YaHei UI",sans-serif}.app{min-height:100vh;display:grid;grid-template-rows:56px 1fr}.titlebar{display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--stroke);background:color-mix(in srgb,var(--mica) 84%,transparent);backdrop-filter:blur(24px)}.brand{display:flex;align-items:center;gap:12px}.app-icon{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;background:linear-gradient(145deg,#74d7ff,#168fc5);color:#062637;font-weight:700}.brand h1{margin:0;font-size:14px;font-weight:600}.nav{color:var(--text);text-decoration:none;padding:7px 12px;border-radius:4px}.nav:hover{background:var(--control)}main{display:grid;place-items:center;padding:32px}.connection-card{width:min(520px,100%);overflow:hidden;border:1px solid var(--stroke-strong);border-radius:8px;background:color-mix(in srgb,var(--layer) 92%,transparent);box-shadow:0 24px 64px #0003}.hero{display:flex;align-items:center;gap:18px;padding:24px;border-bottom:1px solid var(--stroke);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,var(--layer)),var(--layer))}.hero-icon{display:grid;place-items:center;width:58px;height:58px;border-radius:12px;background:var(--accent);color:var(--accent-text)}.hero-icon svg{width:34px;height:34px}.hero h2{margin:0 0 3px;font-size:24px;font-weight:600}.hero p{margin:0;color:var(--muted)}form{display:grid;grid-template-columns:108px 1fr;gap:14px 12px;padding:24px}label{align-self:center;color:var(--text)}input,select,button{font:inherit}input,select{width:100%;min-height:34px;padding:6px 10px;border:1px solid var(--stroke-strong);border-bottom-color:color-mix(in srgb,var(--text) 34%,transparent);border-radius:4px;color:var(--text);background:var(--control);outline:0}input:focus,select:focus{border-color:var(--accent);border-bottom-width:2px}.remember{grid-column:2;display:flex;align-items:center;gap:8px;color:var(--muted)}.remember input{width:18px;min-height:18px;accent-color:var(--accent)}.hint{grid-column:1/-1;margin:0;color:var(--muted)}#error{grid-column:1/-1;min-height:20px;color:var(--danger)}.actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;padding-top:4px}button{min-width:96px;min-height:34px;padding:6px 14px;border:1px solid var(--stroke-strong);border-radius:4px;color:var(--text);background:var(--control);cursor:pointer}button:hover{background:color-mix(in srgb,var(--control) 72%,var(--text) 8%)}button:disabled{opacity:.5;cursor:not-allowed}.primary{border-color:transparent;color:var(--accent-text);background:var(--accent);font-weight:600}.primary:hover{background:var(--accent-hover)}:where(a,button,input,select):focus-visible{outline:2px solid var(--accent);outline-offset:2px}@media(max-width:560px){main{padding:16px}.titlebar{padding:0 16px}form{grid-template-columns:1fr}.remember{grid-column:1}.actions{grid-column:1}.hint,#error{grid-column:1}}
    @media(forced-colors:active){body,.titlebar,.connection-card,.hero,input,select{background:Canvas;color:CanvasText;border-color:ButtonBorder}button{background:ButtonFace;color:ButtonText;border-color:ButtonBorder}.primary{background:Highlight;color:HighlightText}}
  </style>
  <style>.logout-nav{width:34px!important;min-width:34px!important;padding:0!important;border:0!important;background:transparent!important}.logout-nav svg{width:18px;height:18px}.logout-nav:hover{background:var(--control)!important}</style>
<style>dialog[open]{position:fixed;inset-block-start:45%;inset-block-end:auto;max-height:80vh;overflow:auto;transform:translateY(-50%)}</style>
</head>
<body><div class="app">
  <header class="titlebar"><div class="brand"><span class="app-icon">RG</span><h1>Remote Gateway</h1></div><nav class="nav-group" aria-label="应用导航"><a class="nav status-nav" href="/admin" aria-label="状态" title="状态"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg></a><a class="nav settings-nav" href="/settings" aria-label="设置" title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.1A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.12.38.33.72.6 1 .3.28.68.42 1.1.4h.1v4h-.1a1.7 1.7 0 0 0-1.7.6Z"/></svg></a><button class="nav logout-nav" id="logout-account" type="button">退出</button></nav></header>
  <main><section class="connection-card" aria-labelledby="connection-title">
    <div class="hero"><span class="hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4M8 10h8M13 7l3 3-3 3"/></svg></span><div><h2 id="connection-title">远程桌面连接</h2><p id="connection-status">正在连接网关…</p></div></div>
    <form id="connection-form">
      <label for="target">我的连接</label><div><select id="target" required disabled><option value="">请选择已授权连接</option></select><datalist id="target-list"></datalist></div>
      <label for="username">用户名（可选）</label><input id="username" autocomplete="username" disabled>
      <label for="password">密码（可选）</label><input id="password" type="password" autocomplete="current-password" disabled>
      <label class="remember"><input id="remember" type="checkbox">在此浏览器保存这台主机的用户名和密码</label>
      <span id="error" role="alert"></span>
      <div class="actions"><button type="button" id="forget" disabled>清除凭据</button><button class="primary" id="connect" type="submit" disabled>连接</button></div>
    </form>
  </section></main>
</div>
<dialog id="login"><form id="login-form"><strong>连接 Remote Gateway</strong><label for="login-username">用户名</label><input id="login-username" autocomplete="username" required autofocus><label for="login-password">密码</label><input id="login-password" type="password" autocomplete="current-password" required><span id="auth-error"></span><button class="primary" type="submit">登录</button></form></dialog>
<style>dialog{width:min(420px,calc(100% - 32px));padding:0;border:1px solid var(--stroke-strong);border-radius:8px;color:var(--text);background:color-mix(in srgb,var(--layer) 90%,transparent);backdrop-filter:blur(28px);box-shadow:0 24px 70px #0008}dialog::backdrop{background:#0008}dialog form{display:grid;grid-template-columns:1fr;gap:12px;padding:24px}dialog strong{font-size:20px}dialog #auth-error{min-height:20px;color:var(--danger)}</style>
<style>
  :root{color-scheme:dark;--mica:#202020;--layer:#2b2b2b;--stroke:#ffffff12;--stroke-strong:#ffffff22;--text:#f5f5f5;--muted:#ffffff92;--accent:#6cc5f3;--accent-hover:#83cff5;--accent-text:#10232d;--danger:#ff99a4;--control:#222;--glow:transparent}
  body{display:grid;place-items:start center;padding:28px 16px;background:#202020}.app{width:min(560px,100%);min-height:0;display:grid;grid-template-rows:52px auto;border:1px solid var(--stroke-strong);border-radius:8px;background:#2b2b2b;box-shadow:0 18px 50px #0006;overflow:hidden}.titlebar{height:52px;padding:0 14px;border-bottom:0;background:#2b2b2b}.app-icon{display:none}.brand h1{font-size:14px;font-weight:600}.nav-group{display:flex;gap:2px}.nav{display:grid;place-items:center;width:34px;height:34px;padding:0;border-radius:4px}.nav svg{width:18px;height:18px;color:var(--muted)}.nav:hover{background:#ffffff0d}.app main{display:block;padding:0 20px 20px}.connection-card{width:100%;overflow:visible;border:0;border-radius:0;background:transparent;box-shadow:none}.hero{gap:12px;padding:16px 0 18px;border-bottom:0;background:transparent}.hero-icon{width:44px;height:44px;border-radius:8px}.hero-icon svg{width:25px;height:25px}.hero h2{margin:0 0 2px;font-size:20px}.hero p{font-size:12px}.connection-card>form{grid-template-columns:100px 1fr;gap:12px;padding:0}.connection-card>form>label:not(.remember){font-weight:600}.connection-card input{background:#222;border-color:#ffffff20}.remember{font-size:12px}.hint{padding:12px 0;border-top:1px solid var(--stroke);font-size:12px}.actions{padding-top:0}.actions .primary{min-width:124px}.connection-card button{border-color:#ffffff20;background:#333}.connection-card button:hover{background:#3a3a3a}.connection-card .primary{border-color:transparent;background:var(--accent)}.connection-card .primary:hover{background:var(--accent-hover)}dialog{background:#2b2b2bf2}dialog form{padding:20px}dialog strong{font-size:18px}@media(max-width:560px){body{padding:0}.app{min-height:100vh;border:0;border-radius:0}.connection-card>form{grid-template-columns:1fr}.connection-card>form .remember,.connection-card>form .hint,.connection-card>form #error,.connection-card>form .actions{grid-column:1}.connection-card>form>label:not(.remember){margin-bottom:-7px}}
</style>
<script src="/i18n.js"></script>
<script>
const targetSelect=document.querySelector('#target');
const targetList=document.querySelector('#target-list');
const username=document.querySelector('#username');
const password=document.querySelector('#password');
const remember=document.querySelector('#remember');
const connectButton=document.querySelector('#connect');
const forgetButton=document.querySelector('#forget');
const status=document.querySelector('#connection-status');
const error=document.querySelector('#error');
const login=document.querySelector('#login');
const loginForm=document.querySelector('#login-form');
const loginUsername=document.querySelector('#login-username');
const loginPassword=document.querySelector('#login-password');
const authError=document.querySelector('#auth-error');
const logoutAccount=document.querySelector('#logout-account');
document.querySelector('.brand h1').textContent='RemoteLink';document.querySelector('.app-icon').textContent='RL';document.querySelector('#login-form strong').textContent='登录 RemoteLink';
const statusNav=document.querySelector('.status-nav');statusNav.hidden=true;statusNav.title='管理控制台';statusNav.setAttribute('aria-label','管理控制台');
logoutAccount.title='退出登录';logoutAccount.setAttribute('aria-label','退出登录');logoutAccount.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5M14 8l4 4-4 4M9 12h9"/></svg>';
let accessToken='';
let socket;
let targets=[];
function savedProfiles(){try{return JSON.parse(localStorage.getItem('remote-gateway-profiles')||'{}')}catch{return {}}}
function automaticResolution(){const scale=Math.max(1,window.devicePixelRatio||1);return {width:Math.min(7680,Math.max(640,Math.round(screen.width*scale/2)*2)),height:Math.min(4320,Math.max(480,Math.round(screen.height*scale/2)*2))}}
function applyProfile(){
  const key=targetSelect.value;
  const target=targets.find(item=>item.id===key);
  const saved=savedProfiles()[key];
  username.value=saved?.username||target?.username||'';
  password.value=saved?.password||'';
  remember.checked=!!saved;
  forgetButton.disabled=!saved;
}
function connectGateway(){
  const scheme=location.protocol==='https:'?'wss':'ws';
  socket=new WebSocket(`${scheme}://${location.host}/ws`);
  socket.onopen=()=>socket.send(JSON.stringify({type:'authenticate',token:accessToken}));
  socket.onmessage=event=>{
    const message=JSON.parse(event.data);
    if(message.type==='auth-error'){
      accessToken=''; sessionStorage.removeItem('remote-gateway-access-token'); authError.textContent='登录状态已失效，请重新登录'; loginPassword.value=''; login.showModal(); return;
    }
    if(message.type!=='authenticated')return;
    sessionStorage.setItem('remote-gateway-access-token',accessToken);
    if(login.open)login.close();
    targets=message.targets||[];
    targetList.replaceChildren();
    targetSelect.replaceChildren();for(const target of targets){const option=document.createElement('option');option.value=target.id;option.textContent=`${target.name} · ${target.host}`;targetSelect.append(option)}
    const preferred=localStorage.getItem('remote-gateway-last-target');
    targetSelect.value=targets.some(item=>item.id===preferred)?preferred:targets[0]?.id||'';
    const enabled=targets.length>0;
    targetSelect.disabled=!enabled; username.disabled=!enabled; password.disabled=!enabled; connectButton.disabled=!enabled;
    status.textContent=enabled?'选择计算机并输入登录信息':'没有可用的远程主机';
    applyProfile();
  };
  socket.onerror=()=>{status.textContent='无法连接网关';error.textContent='请确认网关服务已启动。'};
}
loginForm.addEventListener('submit',async event=>{event.preventDefault();authError.textContent='';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:loginUsername.value,password:loginPassword.value})});if(!response.ok){authError.textContent='用户名或密码不正确';loginPassword.value='';return}const account=await response.json();accessToken=account.token;sessionStorage.setItem('remote-gateway-access-token',accessToken);loginPassword.value='';statusNav.hidden=!account.admin;connectGateway()}catch(error){authError.textContent='无法连接登录服务'}});
targetSelect.addEventListener('change',applyProfile);
forgetButton.addEventListener('click',()=>{const profiles=savedProfiles();delete profiles[targetSelect.value.trim().toLowerCase()];localStorage.setItem('remote-gateway-profiles',JSON.stringify(profiles));password.value='';remember.checked=false;forgetButton.disabled=true});
document.querySelector('#connection-form').addEventListener('submit',event=>{
  event.preventDefault(); error.textContent='';
  const selected=targets.find(item=>item.id===targetSelect.value);
  if(!selected){error.textContent='请选择已授权连接。';return}
  const host=selected.host;
  const key=selected.id;
  const profiles=savedProfiles();
  if(remember.checked)profiles[key]={username:username.value,password:password.value};else delete profiles[key];
  localStorage.setItem('remote-gateway-profiles',JSON.stringify(profiles));
  localStorage.setItem('remote-gateway-last-target',selected.id);
  let settings={};try{settings=JSON.parse(localStorage.getItem('remote-gateway-settings')||'{}')}catch{}
  if(!(Number(settings.width)>0&&Number(settings.height)>0))Object.assign(settings,automaticResolution());
  settings.bitrate=Number(settings.bitrate)||4000000;
  const network=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  const networkCaps={'slow-2g':750000,'2g':1000000,'3g':2000000};
  if(networkCaps[network?.effectiveType])settings.bitrate=Math.min(settings.bitrate,networkCaps[network.effectiveType]);
  sessionStorage.setItem('remote-gateway-session',JSON.stringify({target:selected?.id||'',host,username:username.value,password:password.value,accessToken,startedAt:Date.now(),...settings}));
  if(socket&&socket.readyState<WebSocket.CLOSING){socket.onclose=null;socket.close()}
  location.href='/session';
});
accessToken=sessionStorage.getItem('remote-gateway-access-token')||'';
const returnedError=sessionStorage.getItem('remote-gateway-error');
if(returnedError){error.textContent=returnedError;sessionStorage.removeItem('remote-gateway-error')}
async function resumeAccount(){if(!accessToken){login.showModal();return}try{const response=await fetch('/api/auth/me',{headers:{Authorization:`Bearer ${accessToken}`},cache:'no-store'});if(!response.ok)throw new Error();const account=await response.json();statusNav.hidden=!account.admin;connectGateway()}catch{accessToken='';sessionStorage.removeItem('remote-gateway-access-token');login.showModal()}}
logoutAccount.addEventListener('click',()=>{if(socket&&socket.readyState<WebSocket.CLOSING){socket.onclose=null;socket.close()}sessionStorage.removeItem('remote-gateway-access-token');sessionStorage.removeItem('remote-gateway-session');location.reload()});
resumeAccount();
</script></body></html>
