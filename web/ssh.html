<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RemoteLink · SSH</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          14px/1.45 "Segoe UI",
          sans-serif;
        --bg: #202020;
        --panel: #2b2b2b;
        --control: #222;
        --line: #ffffff22;
        --text: #f5f5f5;
        --muted: #ffffff92;
        --accent: #73bee8;
        --danger: #ff99a4;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 28px 16px;
        color: var(--text);
        background: var(--bg);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      .app {
        width: min(560px, 100%);
        min-height: 270px;
        margin: auto;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }
      .app:not(.admin-open) {
        height: 270px;
      }
      .bar {
        height: 52px;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 14px;
      }
      .brand {
        font-weight: 600;
        font-size: 14px;
      }
      .nav {
        align-self: stretch;
        display: flex;
      }
      .nav a {
        position: relative;
        display: flex;
        align-items: center;
        padding: 0 14px;
        color: var(--muted);
        text-decoration: none;
        font-weight: 600;
      }
      .nav a[aria-current="page"] {
        color: var(--text);
      }
      .nav a[aria-current="page"]:after {
        content: "";
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: 0;
        height: 2px;
        background: var(--accent);
      }
      .tools {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .account {
        position: relative;
      }
      .account-menu {
        position: absolute;
        z-index: 5;
        top: 40px;
        right: 0;
        width: 190px;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
        box-shadow: 0 14px 36px #0008;
      }
      .account-menu[hidden] {
        display: none !important;
      }
      .account-summary {
        padding: 9px 10px 10px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }
      .account-menu a,
      .account-menu button {
        display: flex;
        width: 100%;
        min-height: 34px;
        padding: 7px 10px;
        border: 0;
        border-radius: 4px;
        color: var(--text);
        background: transparent;
        text-decoration: none;
      }
      .account-menu a:hover,
      .account-menu button:hover {
        background: #ffffff0d;
      }
      .account-trigger {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        padding: 0;
        border: 0;
        border-radius: 4px;
        background: transparent;
        cursor: pointer;
      }
      .account-trigger:hover {
        background: #ffffff0d;
      }
      .account-avatar {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        color: #b3b3b3;
        background: #363636;
      }
      .account-avatar svg,
      .settings-link svg {
        width: 18px;
        height: 18px;
      }
      .settings-link {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 4px;
        color: #b3b3b3;
        text-decoration: none;
      }
      .settings-link:hover {
        background: #ffffff0d;
      }
      .icon {
        width: 34px;
        height: 34px;
        border: 0;
        border-radius: 50%;
        color: #ddd;
        background: #353535;
        cursor: pointer;
      }
      .app > main {
        padding: 16px 20px 24px;
      }
      .hero {
        display: flex;
        gap: 12px;
        align-items: center;
        margin: 0;
        padding-bottom: 18px;
      }
      .hero-icon {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 8px;
        color: #122630;
        background: var(--accent);
        font: 700 18px monospace;
      }
      .hero h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
      }
      .hero p {
        margin: 1px 0;
        color: var(--muted);
        font-size: 12px;
      }
      .field {
        display: grid;
        grid-template-columns: 100px 1fr;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
      }
      select,
      input,
      textarea {
        width: 100%;
        min-height: 36px;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--text);
        background: var(--control);
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 12px;
      }
      .primary,
      .secondary,
      .danger {
        min-width: 124px;
        min-height: 34px;
        border: 0;
        border-radius: 4px;
        background: var(--accent);
        color: #10232d;
        font-weight: 600;
        cursor: pointer;
      }
      .secondary,
      .danger {
        min-width: auto;
        padding: 5px 10px;
        border: 1px solid var(--line);
        color: var(--text);
        background: #373737;
      }
      .danger {
        color: var(--danger);
      }
      .notice {
        min-height: 20px;
        color: var(--danger);
      }
      dialog {
        width: min(760px, calc(100% - 28px));
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
        background: var(--panel);
      }
      dialog::backdrop {
        background: #0009;
      }
      body.settings-mode {
        padding: 28px 16px;
      }
      body.settings-mode .app {
        display: none;
      }
      body.settings-mode #manager {
        display: block;
        position: static;
        width: min(980px, 100%);
        margin: 0 auto;
        padding: 0;
        overflow: hidden;
      }
      body.settings-mode #manager-close {
        display: none;
      }
      .settings-title {
        height: 52px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .settings-title a {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        padding: 0;
        border-radius: 4px;
        color: var(--text);
        text-decoration: none;
      }
      .settings-title a:hover {
        background: #ffffff0d;
      }
      .settings-title a:active {
        background: #ffffff08;
      }
      .settings-title a svg {
        width: 20px;
        height: 20px;
      }
      .settings-title h1 {
        margin: 0;
        font-size: 14px;
      }
      .settings-layout {
        display: grid;
        grid-template-columns: 190px minmax(0, 1fr);
        min-height: 480px;
      }
      .settings-nav {
        padding: 12px 8px;
        border-right: 1px solid var(--line);
        background: #292929;
      }
      .settings-nav a {
        display: block;
        padding: 9px 10px;
        border-radius: 4px;
        color: var(--text);
        text-decoration: none;
      }
      .settings-nav a:hover,
      .settings-nav a[aria-current="page"] {
        background: #ffffff0d;
      }
      .settings-nav a[aria-current="page"] {
        box-shadow: inset 2px 0 var(--accent);
      }
      .settings-content {
        padding: 20px;
      }
      .settings-view[hidden] {
        display: none !important;
      }
      .settings-view h2 {
        margin: 0 0 16px;
        font-size: 18px;
      }
      .settings-content .dialog-head {
        margin-bottom: 12px;
      }
      @media (max-width: 680px) {
        .settings-layout {
          grid-template-columns: 1fr;
        }
        .settings-nav {
          display: flex;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .settings-nav a {
          flex: 1;
          text-align: center;
        }
      }
      .dialog-head,
      .row,
      .row-actions,
      .dialog-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dialog-head h2 {
        margin: 0;
      }
      .dialog-head button {
        margin-left: auto;
      }
      .list {
        margin: 16px 0;
      }
      .row {
        padding: 10px;
        border-bottom: 1px solid var(--line);
      }
      .row-main {
        flex: 1;
      }
      .muted {
        color: var(--muted);
        font-size: 12px;
      }
      .editor {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 10px;
        align-items: center;
      }
      .editor h2,
      .dialog-actions,
      .notice,
      .key-row {
        grid-column: 1/-1;
      }
      .dialog-actions {
        justify-content: flex-end;
        margin-top: 8px;
      }
      .key-row {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 10px;
        align-items: start;
      }
      textarea {
        min-height: 120px;
        resize: vertical;
      }
      @media (max-width: 560px) {
        body {
          padding: 0;
        }
        .app {
          min-height: 100vh;
          border: 0;
        }
        .brand {
          display: none;
        }
        .field,
        .editor,
        .key-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <strong class="brand">RemoteLink</strong>
        <nav class="nav">
          <a href="/">RDP</a><a href="/vnc">VNC</a
          ><a href="/ssh" aria-current="page">SSH</a>
        </nav>
        <div class="tools">
          <a
            id="manage"
            class="settings-link"
            href="/ssh/settings"
            hidden
            title="管理"
            aria-label="管理"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              aria-hidden="true"
            >
              <path d="M3 12h4l2-6 4 12 2-6h6" /></svg
          ></a>
          <div class="account">
            <button
              id="account-trigger"
              class="account-trigger"
              aria-label="用户账户"
              aria-expanded="false"
            >
              <span class="account-avatar"
                ><svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <circle cx="12" cy="8" r="3.5" />
                  <path d="M5 20c.8-4 3.1-6 7-6s6.2 2 7 6" /></svg
              ></span>
            </button>
            <div id="account-menu" class="account-menu" hidden>
              <div id="account-summary" class="account-summary">当前账户</div>
              <a id="users-link" href="/users" hidden>用户管理</a
              ><button id="logout">退出登录</button>
            </div>
          </div>
        </div>
      </header>
      <main>
        <div class="hero">
          <div class="hero-icon">&gt;_</div>
          <div>
            <h1>SSH 连接</h1>
            <p>选择计算机并打开远程终端。</p>
          </div>
        </div>
        <div class="field">
          <strong>我的连接</strong
          ><select id="target">
            <option value="">请选择 SSH 设备</option>
          </select>
        </div>
        <div id="notice" class="notice"></div>
        <div class="actions">
          <button id="connect" class="primary">连接</button>
        </div>
      </main>
    </div>
    <dialog id="manager">
      <header class="settings-title">
        <a href="/ssh" title="返回 SSH 连接" aria-label="返回 SSH 连接"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m15 18-6-6 6-6" /></svg
        ></a>
        <h1>管理</h1>
      </header>
      <div class="settings-layout">
        <nav class="settings-nav" aria-label="SSH 设置">
          <a href="#connections" data-settings-view="connections">SSH 连接</a
          ><a href="#sessions" data-settings-view="sessions">活动会话</a
          ><a href="#history" data-settings-view="history">连接历史</a>
        </nav>
        <main class="settings-content">
          <section class="settings-view" data-settings-panel="connections">
            <div class="dialog-head">
              <h2>SSH 连接</h2>
              <button id="add" class="primary">添加连接</button>
            </div>
            <div id="list" class="list"></div>
          </section>
          <section class="settings-view" data-settings-panel="sessions" hidden>
            <h2>活动会话</h2>
            <div id="active" class="list"></div>
          </section>
          <section class="settings-view" data-settings-panel="history" hidden>
            <h2>连接历史</h2>
            <div id="history" class="list"></div>
          </section>
        </main>
      </div>
      <button id="manager-close" class="secondary" hidden>关闭</button>
    </dialog>
    <dialog id="editor">
      <form id="form" class="editor">
        <h2 id="editor-title">添加 SSH 连接</h2>
        <label>连接名称</label
        ><input id="name" maxlength="128" required /><label>主机</label
        ><input id="host" maxlength="255" required /><label>端口</label
        ><input
          id="port"
          type="number"
          min="1"
          max="65535"
          value="22"
          required
        /><label>用户名</label
        ><input id="username" maxlength="256" required /><label>认证方式</label
        ><select id="auth">
          <option value="password">用户名和密码</option>
          <option value="key">SSH 私钥</option></select
        ><label id="password-label">密码</label
        ><input id="password" type="password" />
        <div id="key-fields" class="key-row" hidden>
          <label>私钥</label
          ><textarea
            id="private-key"
            placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"
          ></textarea
          ><label>私钥口令（可选）</label
          ><input id="passphrase" type="password" />
        </div>
        <div id="editor-notice" class="notice"></div>
        <div class="dialog-actions">
          <button id="cancel" type="button" class="secondary">取消</button
          ><button id="test" type="button" class="secondary">测试连接</button
          ><button class="primary">保存</button>
        </div>
      </form>
    </dialog>
    <script>
      const token = sessionStorage.getItem("remote-gateway-access-token") || "",
        target = document.querySelector("#target"),
        notice = document.querySelector("#notice"),
        manager = document.querySelector("#manager"),
        editor = document.querySelector("#editor");
      let connections = [],
        editing = null;
      const settingsMode = location.pathname === "/ssh/settings";
      if (settingsMode) {
        document.body.classList.add("settings-mode");
        manager.setAttribute("open", "");
      }
      function selectSettingsView() {
        const requested = location.hash.slice(1),
          view = ["connections", "sessions", "history"].includes(requested)
            ? requested
            : "connections";
        document
          .querySelectorAll("[data-settings-panel]")
          .forEach(
            (panel) => (panel.hidden = panel.dataset.settingsPanel !== view),
          );
        document
          .querySelectorAll("[data-settings-view]")
          .forEach((link) =>
            link.setAttribute(
              "aria-current",
              link.dataset.settingsView === view ? "page" : "false",
            ),
          );
      }
      window.addEventListener("hashchange", selectSettingsView);
      selectSettingsView();
      async function api(path, options = {}) {
        const response = await fetch(path, {
            ...options,
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
            },
          }),
          data = await response.json().catch(() => ({}));
        if (response.status === 401) {
          location.href = "/";
          throw new Error("请先登录");
        }
        if (!response.ok)
          throw new Error(data.error || `HTTP ${response.status}`);
        return data;
      }
      async function refresh() {
        const me = await api("/api/auth/me");
        document.querySelector("#manage").hidden = !me.admin;
        document.querySelector("#users-link").hidden = !me.admin;
        document.querySelector("#account-summary").textContent =
          me.username && me.username !== me.name
            ? `${me.name} · ${me.username}`
            : me.name;
        const data = await api("/api/ssh/targets");
        const availableTargets = data.targets || [];
        target.replaceChildren();
        if (availableTargets.length) {
          for (const item of availableTargets)
            target.add(new Option(item.name, item.id));
          target.selectedIndex = 0;
        } else target.add(new Option("请选择 SSH 设备", ""));
        if (me.admin) {
          connections = (await api("/api/admin/ssh")).connections || [];
          const activity = await api("/api/admin/ssh/activity");
          renderActivity(activity);
          renderList();
        }
      }
      function renderList() {
        const list = document.querySelector("#list");
        list.replaceChildren();
        for (const item of connections) {
          const row = document.createElement("div"),
            main = document.createElement("div"),
            actions = document.createElement("div");
          row.className = "row";
          main.className = "row-main";
          main.innerHTML = '<strong></strong><div class="muted"></div>';
          main.children[0].textContent = item.name;
          main.children[1].textContent = `${item.username}@${item.host}:${item.port} · ${item.authType === "key" ? "私钥" : "密码"}${item.hostKeySha256 ? " · 指纹已信任" : ""}`;
          actions.className = "row-actions";
          actions.append(
            button("编辑", () => openEditor(item)),
            button("重置信任", () => resetTrust(item)),
            button("清除凭据", () => clearCredentials(item)),
            button("删除", () => removeConnection(item), "danger"),
          );
          row.append(main, actions);
          list.append(row);
        }
        if (!connections.length)
          list.innerHTML = '<div class="muted">尚无 SSH 连接。</div>';
      }
      function renderActivity(data) {
        for (const [key, items] of [
          ["active", data.active || []],
          ["history", data.history || []],
        ]) {
          const root = document.querySelector(`#${key}`);
          root.replaceChildren();
          for (const item of items) {
            const row = document.createElement("div");
            row.className = "row";
            const main = document.createElement("div");
            main.className = "row-main";
            main.innerHTML = '<strong></strong><div class="muted"></div>';
            main.children[0].textContent = item.targetName;
            main.children[1].textContent = `${item.username || "用户"} · ${new Date(item.startedAt * 1000).toLocaleString()}`;
            row.append(main);
            if (key === "active")
              row.append(
                button(
                  "断开",
                  async () => {
                    await api("/api/admin/ssh/disconnect", {
                      method: "POST",
                      body: JSON.stringify({ id: item.id }),
                    });
                    await refresh();
                  },
                  "danger",
                ),
              );
            root.append(row);
          }
          if (!items.length)
            root.innerHTML = '<div class="muted">暂无记录。</div>';
        }
      }
      function button(text, handler, style = "secondary") {
        const value = document.createElement("button");
        value.className = style;
        value.textContent = text;
        value.onclick = handler;
        return value;
      }
      function toggleAuth() {
        const key = document.querySelector("#auth").value === "key";
        document.querySelector("#key-fields").hidden = !key;
        document.querySelector("#password").hidden = key;
        document.querySelector("#password-label").hidden = key;
      }
      function openEditor(item = null) {
        editing = item;
        document.querySelector("#form").reset();
        document.querySelector("#editor-title").textContent = item
          ? "编辑 SSH 连接"
          : "添加 SSH 连接";
        for (const key of ["name", "host", "port", "username"])
          document.querySelector(`#${key}`).value =
            item?.[key] || (key === "port" ? 22 : "");
        document.querySelector("#auth").value = item?.authType || "password";
        toggleAuth();
        editor.showModal();
      }
      async function removeConnection(item) {
        if (!confirm(`删除“${item.name}”？`)) return;
        await api("/api/admin/ssh/delete", {
          method: "POST",
          body: JSON.stringify({ id: item.id }),
        });
        await refresh();
      }
      async function resetTrust(item) {
        if (
          !item.hostKeySha256 ||
          !confirm(`重置“${item.name}”的主机指纹信任？`)
        )
          return;
        await api("/api/admin/ssh/trust/reset", {
          method: "POST",
          body: JSON.stringify({ id: item.id }),
        });
        await refresh();
      }
      async function clearCredentials(item) {
        if (!confirm(`清除“${item.name}”保存的登录凭据？`)) return;
        await api("/api/admin/ssh/credentials/clear", {
          method: "POST",
          body: JSON.stringify({ id: item.id }),
        });
        await refresh();
      }
      document.querySelector("#connect").onclick = async () => {
        if (!target.value) {
          notice.textContent = "请选择 SSH 设备。";
          return;
        }
        try {
          notice.textContent = "正在连接…";
          const session = await api("/api/ssh/sessions", {
            method: "POST",
            body: JSON.stringify({ targetId: target.value }),
          });
          sessionStorage.setItem(
            "remotelink-ssh-session",
            JSON.stringify(session),
          );
          location.href = `/ssh/session?name=${encodeURIComponent(target.options[target.selectedIndex].text)}`;
        } catch (error) {
          notice.textContent = error.message;
        }
      };
      const accountTrigger = document.querySelector("#account-trigger"),
        accountMenu = document.querySelector("#account-menu");
      accountTrigger.onclick = () => {
        accountMenu.hidden = !accountMenu.hidden;
        accountTrigger.setAttribute(
          "aria-expanded",
          String(!accountMenu.hidden),
        );
      };
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".account")) accountMenu.hidden = true;
      });
      document.querySelector("#logout").onclick = () => {
        sessionStorage.clear();
        location.href = "/";
      };
      document.querySelector("#manager-close").onclick = () => manager.close();
      document.querySelector("#add").onclick = () => openEditor();
      document.querySelector("#cancel").onclick = () => editor.close();
      document.querySelector("#auth").onchange = toggleAuth;
      function formPayload() {
        return {
          id: editing?.id,
          name: document.querySelector("#name").value.trim(),
          host: document.querySelector("#host").value.trim(),
          port: Number(document.querySelector("#port").value),
          username: document.querySelector("#username").value.trim(),
          authType: document.querySelector("#auth").value,
          password: document.querySelector("#password").value,
          privateKey: document.querySelector("#private-key").value,
          passphrase: document.querySelector("#passphrase").value,
        };
      }
      document.querySelector("#test").onclick = async () => {
        const output = document.querySelector("#editor-notice");
        try {
          output.textContent = "正在验证连接和身份…";
          const result = await api("/api/admin/ssh/test", {
            method: "POST",
            body: JSON.stringify(formPayload()),
          });
          output.textContent = result.authenticated
            ? `连接成功 · ${result.hostKeySha256}`
            : result.error || "连接失败";
        } catch (error) {
          output.textContent = error.message;
        }
      };
      document.querySelector("#form").onsubmit = async (event) => {
        event.preventDefault();
        const payload = formPayload();
        try {
          await api("/api/admin/ssh/save", {
            method: "POST",
            body: JSON.stringify(payload),
          });
          editor.close();
          await refresh();
        } catch (error) {
          document.querySelector("#editor-notice").textContent = error.message;
        }
      };
      refresh().catch((error) => (notice.textContent = error.message));
    </script>
  </body>
</html>
