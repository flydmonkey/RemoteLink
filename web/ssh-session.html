<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RemoteLink · SSH 控制台</title>
    <script src="/i18n.js?v=__REMOTELINK_VERSION__" defer></script>
    <link rel="stylesheet" href="/vendor/xterm/xterm.css?v=__REMOTELINK_VERSION__" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        background: #101010;
        color: #eee;
        font:
          14px/1.45 Consolas,
          "Cascadia Mono",
          monospace;
      }
      .remote-toolbar {
        position: fixed;
        z-index: 5;
        left: 12px;
        top: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        width: 48px;
        padding: 6px;
        border: 1px solid #ffffff2e;
        border-radius: 8px;
        background: #292929dd;
        box-shadow: 0 8px 28px #0008;
        backdrop-filter: blur(24px);
        transform: translateY(-50%);
        transition: transform 0.18s ease;
      }
      .remote-toolbar.collapsed {
        transform: translate(calc(-100% - 12px), -50%);
      }
      .remote-toolbar button {
        position: relative;
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        min-height: 34px;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 4px;
        color: #f5f5f5;
        background: transparent;
        cursor: pointer;
      }
      .remote-toolbar button:hover {
        background: #ffffff18;
      }
      .remote-toolbar svg {
        width: 20px;
        height: 20px;
        pointer-events: none;
      }
      .toolbar-divider {
        width: 24px;
        height: 1px;
        margin: 4px 0;
        background: #ffffff2e;
      }
      .toolbar-tooltip {
        position: absolute;
        z-index: 2;
        left: calc(100% + 12px);
        top: 50%;
        padding: 5px 9px;
        border: 1px solid #ffffff2a;
        border-radius: 4px;
        color: #f5f5f5;
        background: #2b2b2b;
        box-shadow: 0 4px 16px #0004;
        font:
          12px/18px "Segoe UI",
          sans-serif;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transform: translateY(-50%);
        transition: opacity 0.12s;
      }
      .remote-toolbar button:hover .toolbar-tooltip,
      .remote-toolbar button:focus-visible .toolbar-tooltip {
        opacity: 1;
      }
      .remote-toolbar.collapsed #toolbar-toggle {
        position: absolute;
        left: calc(100% + 12px);
        top: 50%;
        border: 1px solid #ffffff2e;
        border-left: 0;
        border-radius: 0 8px 8px 0;
        background: #292929;
        transform: translateY(-50%);
      }
      .remote-toolbar.collapsed #toolbar-toggle svg {
        transform: rotate(180deg);
      }
      #terminal {
        height: 100vh;
        margin: 0;
        padding: 14px;
        overflow: auto;
        outline: 0;
      }
      #status {
        position: fixed;
        z-index: 4;
        right: 12px;
        top: 10px;
        padding: 5px 9px;
        border-radius: 4px;
        background: #292929cc;
        font:
          12px "Segoe UI",
          sans-serif;
        color: #9d9d9d;
      }
      .file-dialog {
        width: min(860px, calc(100vw - 32px));
        height: min(620px, calc(100vh - 32px));
        padding: 0;
        border: 1px solid #ffffff2e;
        border-radius: 8px;
        color: #eee;
        background: #292929;
        box-shadow: 0 20px 60px #000a;
        font: 14px/1.45 "Segoe UI", sans-serif;
      }
      .file-dialog::backdrop { background: #0009; backdrop-filter: blur(3px); }
      .file-shell { display: flex; flex-direction: column; height: 100%; }
      .file-header, .file-actions {
        display: flex; align-items: center; gap: 8px; padding: 14px 16px;
        border-bottom: 1px solid #ffffff1c;
      }
      .file-header h2 { flex: 1; margin: 0; font-size: 18px; font-weight: 600; }
      .file-actions { padding: 10px 16px; }
      .file-path {
        flex: 1; min-width: 0; padding: 8px 10px; overflow: hidden;
        border: 1px solid #ffffff24; border-radius: 4px; color: #ccc;
        background: #1c1c1c; text-overflow: ellipsis; white-space: nowrap;
      }
      .file-dialog button {
        min-height: 34px; padding: 0 12px; border: 1px solid #ffffff2a;
        border-radius: 4px; color: #f5f5f5; background: #333; cursor: pointer;
      }
      .file-dialog button:hover { background: #3c3c3c; }
      .file-dialog .primary { border-color: #73bee8; color: #111; background: #73bee8; }
      .file-list { flex: 1; overflow: auto; padding: 8px 16px 16px; }
      .file-row {
        display: grid; grid-template-columns: minmax(180px, 1fr) 110px 155px 128px;
        align-items: center; min-height: 45px; gap: 12px; padding: 0 10px;
        border-bottom: 1px solid #ffffff12;
      }
      .file-row.header { min-height: 36px; color: #999; font-size: 12px; }
      .file-name { overflow: hidden; color: #eee; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
      button.file-name { padding: 0; border: 0; background: transparent; }
      .file-name.directory { color: #8ac9ed; }
      .file-buttons { display: flex; justify-content: flex-end; gap: 6px; }
      .file-buttons button { min-height: 30px; padding: 0 9px; }
      .file-empty { padding: 50px 12px; color: #999; text-align: center; }
      .file-notice { min-height: 22px; padding: 0 16px 10px; color: #e5a7a7; }
      @media (max-width: 650px) {
        .file-row { grid-template-columns: minmax(140px, 1fr) 90px 120px; }
        .file-modified { display: none; }
        .file-actions { flex-wrap: wrap; }
        .file-path { flex-basis: 100%; order: -1; }
      }
    </style>
  </head>
  <body>
    <span id="status">正在连接…</span>
    <aside
      class="remote-toolbar"
      id="remote-toolbar"
      aria-label="远程会话工具栏"
    >
      <button id="copy" aria-label="复制">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <rect x="8" y="8" width="11" height="12" rx="2" />
          <path
            d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h2"
          /></svg
        ><span class="toolbar-tooltip">复制</span>
      </button>
      <button id="paste" aria-label="粘贴">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <rect x="8" y="3" width="8" height="4" rx="1" />
          <path
            d="M16 5h2a2 2 0 0 1 2 2v13H4V7a2 2 0 0 1 2-2h2M8 12h8M8 16h5"
          /></svg
        ><span class="toolbar-tooltip">粘贴</span>
      </button>
      <button id="files" aria-label="文件管理">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H10l2 2h6.5A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z" />
        </svg><span class="toolbar-tooltip">文件管理</span>
      </button>
      <button id="fullscreen" aria-label="全屏">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path
            d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"
          /></svg
        ><span class="toolbar-tooltip">全屏</span>
      </button>
      <div class="toolbar-divider" role="separator"></div>
      <button
        id="disconnect"
        class="disconnect-action"
        type="button"
        aria-label="断开连接"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5M14 8l4 4-4 4M9 12h9"
          /></svg
        ><span class="toolbar-tooltip">断开连接</span>
      </button>
      <div class="toolbar-divider"></div>
      <button id="toolbar-toggle" aria-label="收起工具栏">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="m15 18-6-6 6-6" /></svg
        ><span class="toolbar-tooltip">收起</span>
      </button>
    </aside>
    <div id="terminal"></div>
    <dialog class="file-dialog" id="file-dialog">
      <div class="file-shell">
        <div class="file-header"><h2>文件管理</h2><button id="file-close" aria-label="关闭">关闭</button></div>
        <div class="file-actions">
          <button id="file-home">家目录</button><button id="file-up">上一级</button>
          <div class="file-path" id="file-path"></div>
          <button id="file-refresh">刷新</button><button class="primary" id="file-upload">上传</button>
          <input id="file-input" type="file" hidden />
        </div>
        <div class="file-list">
          <div class="file-row header"><span>名称</span><span>大小</span><span class="file-modified">修改时间</span><span>操作</span></div>
          <div id="file-items"></div>
        </div>
        <div class="file-notice" id="file-notice" aria-live="polite"></div>
      </div>
    </dialog>
    <script src="/vendor/xterm/xterm.js?v=__REMOTELINK_VERSION__"></script>
    <script>
      const terminalElement = document.querySelector("#terminal"),
        status = document.querySelector("#status"),
        saved = JSON.parse(
          sessionStorage.getItem("remotelink-ssh-session") || "null",
        ),
        name = new URLSearchParams(location.search).get("name") || "SSH";
      document.title = `RemoteLink · ${name}`;
      let socket;
      const terminal = new Terminal({
        cursorBlink: true,
        fontFamily: 'Consolas,"Cascadia Mono",monospace',
        fontSize: 14,
        theme: {
          background: "#101010",
          foreground: "#eeeeee",
          cursor: "#73bee8",
        },
        scrollback: 5000,
      });
      terminal.open(terminalElement);
      const append = (text) => terminal.write(text);
      function resizeTerminal() {
        const columns = Math.max(
          20,
          Math.floor(terminalElement.clientWidth / 8.45),
        );
        const rows = Math.max(5, Math.floor(terminalElement.clientHeight / 20));
        terminal.resize(columns, rows);
        if (socket?.readyState === WebSocket.OPEN)
          socket.send(JSON.stringify({ type: "resize", columns, rows }));
      }
      window.addEventListener("resize", resizeTerminal);
      resizeTerminal();
      if (!saved?.websocketUrl) {
        status.textContent = "会话已失效";
        append("请返回 SSH 页面重新连接。\n");
      } else {
        const scheme = location.protocol === "https:" ? "wss:" : "ws:";
        socket = new WebSocket(
          `${scheme}//${location.host}${saved.websocketUrl}`,
        );
        socket.binaryType = "arraybuffer";
        socket.onopen = () => {
          status.textContent = "已连接";
          resizeTerminal();
          terminal.focus();
        };
        socket.onmessage = (event) =>
          append(
            typeof event.data === "string"
              ? event.data
              : new TextDecoder().decode(event.data),
          );
        socket.onclose = () => {
          status.textContent = "已断开";
          append("\n[连接已断开]\n");
        };
        socket.onerror = () => (status.textContent = "连接失败");
      }
      terminal.onData((value) => {
        if (socket?.readyState === WebSocket.OPEN)
          socket.send(new TextEncoder().encode(value));
      });
      document.querySelector("#copy").onclick = async () => {
        const value = terminal.getSelection();
        if (value) await navigator.clipboard.writeText(value);
      };
      document.querySelector("#paste").onclick = async () => {
        try {
          const value = await navigator.clipboard.readText();
          if (value && socket?.readyState === WebSocket.OPEN)
            socket.send(new TextEncoder().encode(value));
        } catch {
          status.textContent = "浏览器未授予剪贴板权限";
        }
      };
      const fileDialog = document.querySelector("#file-dialog"),
        fileItems = document.querySelector("#file-items"),
        filePath = document.querySelector("#file-path"),
        fileNotice = document.querySelector("#file-notice"),
        fileInput = document.querySelector("#file-input"),
        accessToken = sessionStorage.getItem("remotelink-access-token") || "";
      let currentPath = "", homePath = "";
      const formatSize = (size) => {
        if (!size) return "—";
        const units = ["B", "KB", "MB", "GB"];
        let value = size, unit = 0;
        while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit += 1; }
        return `${value < 10 && unit ? value.toFixed(1) : Math.round(value)} ${units[unit]}`;
      };
      async function fileRequest(path, remotePath, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: { Authorization: `Bearer ${accessToken}`, "X-Target-Id": saved?.targetId || "",
            "X-File-Name": encodeURIComponent(remotePath || ""), ...(options.headers || {}) },
        });
        if (!response.ok) {
          const payload = await response.json().catch(() => ({}));
          throw new Error(payload.error || `HTTP ${response.status}`);
        }
        return response;
      }
      function parentPath(path) {
        if (!path || path === "/") return "/";
        const value = path.replace(/\/+$/, "");
        return value.slice(0, value.lastIndexOf("/")) || "/";
      }
      async function loadFiles(path = currentPath) {
        fileNotice.textContent = "正在读取文件…";
        try {
          const data = await (await fileRequest("/api/ssh/files", path)).json();
          currentPath = data.path; homePath = data.home; filePath.textContent = currentPath;
          fileItems.replaceChildren();
          const entries = [...data.items].sort((a, b) => Number(b.directory) - Number(a.directory) || a.name.localeCompare(b.name));
          if (!entries.length) fileItems.innerHTML = '<div class="file-empty">此目录为空</div>';
          for (const item of entries) {
            const row = document.createElement("div"); row.className = "file-row";
            const nameButton = document.createElement("button");
            nameButton.className = `file-name${item.directory ? " directory" : ""}`;
            nameButton.textContent = `${item.directory ? "▸ " : ""}${item.name}`;
            if (item.directory) nameButton.onclick = () => loadFiles(item.path);
            const size = document.createElement("span"); size.textContent = item.directory ? "—" : formatSize(item.size);
            const modified = document.createElement("span"); modified.className = "file-modified";
            modified.textContent = item.modified ? new Date(item.modified * 1000).toLocaleString() : "—";
            const buttons = document.createElement("span"); buttons.className = "file-buttons";
            if (!item.directory) {
              const download = document.createElement("button"); download.textContent = "下载";
              download.onclick = async () => {
                fileNotice.textContent = "正在下载…";
                try {
                  const blob = await (await fileRequest("/api/ssh/files/download", item.path, { method: "POST" })).blob();
                  const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = item.name; link.click();
                  setTimeout(() => URL.revokeObjectURL(link.href), 1000); fileNotice.textContent = "";
                } catch (error) { fileNotice.textContent = error.message; }
              }; buttons.append(download);
            }
            const remove = document.createElement("button"); remove.textContent = "删除";
            remove.onclick = async () => {
              if (!confirm(`删除“${item.name}”？`)) return;
              try { await fileRequest("/api/ssh/files/delete", item.path, { method: "POST" }); await loadFiles(); }
              catch (error) { fileNotice.textContent = error.message; }
            }; buttons.append(remove); row.append(nameButton, size, modified, buttons); fileItems.append(row);
          }
          fileNotice.textContent = "";
        } catch (error) { fileNotice.textContent = error.message; }
      }
      document.querySelector("#files").onclick = () => { fileDialog.showModal(); loadFiles(""); };
      document.querySelector("#file-close").onclick = () => fileDialog.close();
      document.querySelector("#file-home").onclick = () => loadFiles(homePath);
      document.querySelector("#file-up").onclick = () => loadFiles(parentPath(currentPath));
      document.querySelector("#file-refresh").onclick = () => loadFiles();
      document.querySelector("#file-upload").onclick = () => fileInput.click();
      fileInput.onchange = async () => {
        const file = fileInput.files?.[0]; if (!file) return;
        const destination = `${currentPath === "/" ? "" : currentPath}/${file.name}`;
        fileNotice.textContent = "正在上传…";
        try { await fileRequest("/api/ssh/files/upload", destination, { method: "POST", body: file }); await loadFiles(); }
        catch (error) { fileNotice.textContent = error.message; }
        finally { fileInput.value = ""; }
      };
      document.querySelector("#fullscreen").onclick = async () => {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
        resizeTerminal();
      };
      document.querySelector("#disconnect").onclick = () => {
        if (socket) socket.close();
        location.href = "/ssh";
      };
      const toolbar = document.querySelector("#remote-toolbar"),
        toolbarToggle = document.querySelector("#toolbar-toggle");
      toolbarToggle.onclick = () => {
        const collapsed = toolbar.classList.toggle("collapsed");
        toolbarToggle.setAttribute(
          "aria-label",
          collapsed ? "展开工具栏" : "收起工具栏",
        );
        toolbarToggle.querySelector(".toolbar-tooltip").textContent = collapsed
          ? "展开"
          : "收起";
      };
    </script>
  </body>
</html>
