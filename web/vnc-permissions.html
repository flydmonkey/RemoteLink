<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RemoteLink · VNC 用户授权</title><style>:root{color-scheme:dark;font:14px/1.45 "Segoe UI Variable","Segoe UI","Microsoft YaHei UI",sans-serif;--bg:#202020;--panel:#2b2b2b;--line:#ffffff18;--text:#f5f5f5;--muted:#ffffff92;--accent:#6cc5f3;--accent-text:#10232d}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;color:var(--text);background:var(--bg)}button{font:inherit}.app{width:min(960px,100%);min-height:560px;margin:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}.titlebar{height:52px;display:flex;align-items:center;gap:18px;padding:0 14px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--accent-text);font-size:10px;font-weight:800}.protocol-nav{align-self:stretch;display:flex}.protocol-nav a{display:flex;align-items:center;padding:0 14px;color:var(--muted);text-decoration:none;font-weight:600}.protocol-nav a[aria-current=page]{color:var(--text)}.workspace{display:grid;grid-template-columns:190px 1fr;min-height:508px}.side{padding:14px 10px;border-right:1px solid var(--line);background:#292929}.side h2{margin:4px 10px 10px;color:var(--muted);font-size:12px}.side a{display:block;padding:8px 10px;border-radius:4px;color:var(--muted);text-decoration:none}.side a.active{color:var(--text);background:#ffffff0d;box-shadow:inset 2px 0 var(--accent)}main{padding:24px}h1{margin:0 0 4px;font-size:22px}.lead{margin:0 0 20px;color:var(--muted)}.user{display:grid;grid-template-columns:160px 1fr auto;gap:12px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}.checks{display:flex;flex-wrap:wrap;gap:9px 16px}.checks label{color:var(--muted)}button{min-height:32px;padding:5px 12px;border:0;border-radius:4px;color:var(--accent-text);background:var(--accent);font-weight:600}.notice{min-height:20px;color:var(--muted)}@media(max-width:650px){body{padding:0}.app{min-height:100vh;border:0}.workspace{grid-template-columns:1fr}.side{border:0}.side a{display:inline-block}main{padding:18px 14px}.user{grid-template-columns:1fr}}</style></head><body><div class="app"><header class="titlebar"><div class="brand"><span class="mark">RL</span><strong>RemoteLink</strong></div><nav class="protocol-nav"><a href="/">RDP</a><a href="/vnc" aria-current="page">VNC</a><a href="/ssh">SSH</a></nav></header><div class="workspace"><aside class="side"><h2>VNC 管理</h2><a href="/vnc?admin=1">连接管理</a><a class="active" href="/vnc/permissions">用户授权</a><a>活动会话</a><a>连接历史</a></aside><main><h1>VNC 用户授权</h1><p class="lead">为普通用户分配可访问的 VNC 设备。</p><div id="notice" class="notice"></div><div id="permissions"></div></main></div></div><script>
const token=sessionStorage.getItem('remote-gateway-access-token')||'',notice=document.querySelector('#notice'),root=document.querySelector('#permissions');let connections=[];
async function api(path,options={}){const response=await fetch(path,{...options,headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'}}),data=await response.json();if(response.status===401||response.status===403){location.href='/';throw new Error('unauthorized')}if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);return data}
function render(users){root.replaceChildren();for(const user of users.filter(item=>!item.admin)){const row=document.createElement('div');const userName=document.createElement('strong');const checks=document.createElement('div');const save=document.createElement('button');row.className='user';userName.textContent=user.name||user.username;checks.className='checks';for(const target of connections){const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=user.allowedTargets.includes(target.id);input.dataset.id=target.id;label.append(input,` ${target.name}`);checks.append(label)}if(!connections.length)checks.textContent='尚未配置 VNC 连接';save.textContent='保存授权';save.onclick=async()=>{const vncIds=new Set(connections.map(item=>item.id)),kept=user.allowedTargets.filter(id=>!vncIds.has(id)),selected=[...checks.querySelectorAll('input:checked')].map(input=>input.dataset.id);await api('/api/admin/users/permissions',{method:'POST',body:JSON.stringify({id:user.id,targetIds:[...kept,...selected]})});notice.textContent=`已保存 ${userName.textContent} 的授权`;await refresh()};row.append(userName,checks,save);root.append(row)}if(!root.children.length)root.textContent='尚无普通用户。'}
async function refresh(){const [vnc,users]=await Promise.all([api('/api/admin/vnc'),api('/api/admin/users')]);connections=vnc.connections||[];render(users.items||[])}refresh().catch(error=>{if(error.message!=='unauthorized')notice.textContent=error.message});
</script></body></html>
