<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RemoteLink · VNC 会话</title>
    <link rel="icon" href="/remotelink-icon.png" />
    <script src="/i18n.js" defer></script>
    <style>
      :root {
        color-scheme: dark;
        --layer: #2b2b2b;
        --control: #ffffff0f;
        --control-hover: #ffffff18;
        --line: #ffffff20;
        --line-strong: #ffffff2a;
        --text: #f5f5f5;
        --muted: #ffffff92;
        --accent: #6cc5f3;
        --danger: #ff99a4;
        font:
          13px/1.4 "Segoe UI Variable",
          "Segoe UI",
          "Microsoft YaHei UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: var(--text);
      }
      .session {
        height: 100%;
      }
      #screen {
        position: relative;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        background: #000;
        overflow: hidden;
      }
      #screen canvas {
        cursor: default !important;
      }
      .status {
        position: absolute;
        z-index: 2;
        inset: 0;
        display: grid;
        place-items: center;
        background: #000;
        text-align: center;
      }
      .status[hidden] {
        display: none;
      }
      .status p {
        color: var(--muted);
      }
      .status-actions {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 16px;
      }
      .status-actions[hidden] {
        display: none;
      }
      .status-actions button,
      .status-actions a {
        min-height: 34px;
        padding: 7px 14px;
        border: 1px solid var(--line-strong);
        border-radius: 4px;
        color: var(--text);
        background: var(--control);
        text-decoration: none;
        cursor: pointer;
      }
      .status-actions .primary {
        border-color: transparent;
        color: #10232d;
        background: var(--accent);
        font-weight: 600;
      }
      .remote-toolbar {
        position: absolute;
        z-index: 5;
        left: 12px;
        top: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        width: 48px;
        padding: 6px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: color-mix(in srgb, var(--layer) 82%, transparent);
        box-shadow: 0 8px 28px #0005;
        backdrop-filter: blur(24px) saturate(1.2);
        transform: translateY(-50%);
        transition: transform 0.18s ease;
      }
      .remote-toolbar.collapsed {
        transform: translate(calc(-100% - 12px), -50%);
      }
      .remote-toolbar button {
        position: relative;
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        min-height: 34px;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 4px;
        color: var(--text);
        background: transparent;
        cursor: pointer;
      }
      .remote-toolbar button:hover {
        background: var(--control-hover);
      }
      .remote-toolbar button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .remote-toolbar button.active {
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 16%, transparent);
      }
      .remote-toolbar button.danger {
        color: var(--danger);
      }
      .remote-toolbar svg {
        width: 20px;
        height: 20px;
        pointer-events: none;
      }
      .toolbar-divider {
        width: 24px;
        height: 1px;
        margin: 4px 0;
        background: var(--line-strong);
      }
      .toolbar-tooltip {
        position: absolute;
        z-index: 2;
        left: calc(100% + 12px);
        top: 50%;
        padding: 5px 9px;
        border: 1px solid var(--line-strong);
        border-radius: 4px;
        color: var(--text);
        background: var(--layer);
        box-shadow: 0 4px 16px #0004;
        font-size: 12px;
        line-height: 18px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transform: translateY(-50%);
        transition: opacity 0.12s;
      }
      .remote-toolbar button:hover .toolbar-tooltip,
      .remote-toolbar button:focus-visible .toolbar-tooltip {
        opacity: 1;
      }
      .remote-toolbar.collapsed .toolbar-toggle {
        position: absolute;
        left: calc(100% + 12px);
        top: 50%;
        border: 1px solid var(--line-strong);
        border-left: 0;
        border-radius: 0 8px 8px 0;
        background: color-mix(in srgb, var(--layer) 88%, transparent);
        transform: translateY(-50%);
      }
      .remote-toolbar.collapsed .toolbar-toggle svg {
        transform: rotate(180deg);
      }
      dialog {
        width: min(420px, calc(100% - 32px));
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
        background: #2b2b2b;
      }
      textarea {
        width: 100%;
        min-height: 120px;
        margin: 12px 0;
        padding: 9px;
        color: var(--text);
        background: #222;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .actions button {
        padding: 6px 12px;
        color: var(--text);
        background: #363636;
        border: 0;
        border-radius: 4px;
      }
      .actions .primary {
        color: #10232d;
        background: var(--accent);
      }
      @media (max-width: 640px) {
        .remote-toolbar {
          left: 8px;
        }
        .toolbar-tooltip {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="session">
      <main id="screen">
        <aside
          class="remote-toolbar"
          id="remote-toolbar"
          aria-label="远程会话工具栏"
        >
          <button id="clipboard" type="button" aria-label="剪贴板">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <rect x="8" y="3" width="8" height="4" rx="1" />
              <path
                d="M16 5h2a2 2 0 0 1 2 2v13H4V7a2 2 0 0 1 2-2h2M8 12h8M8 16h5"
              /></svg
            ><span class="toolbar-tooltip">剪贴板</span></button
          ><button id="cad" type="button" aria-label="Ctrl+Alt+Del">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <rect x="2" y="4" width="20" height="16" rx="2" />
              <path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M7 15h10" /></svg
            ><span class="toolbar-tooltip">Ctrl+Alt+Del</span></button
          ><button id="view-only" type="button" aria-label="只读模式">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
              <circle cx="12" cy="12" r="2.5" /></svg
            ><span class="toolbar-tooltip">只读：关</span></button
          ><button id="fullscreen" type="button" aria-label="全屏">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <path
                d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"
              /></svg
            ><span class="toolbar-tooltip">全屏</span>
          </button>
          <div class="toolbar-divider" role="separator"></div>
          <button
            class="danger"
            id="disconnect"
            type="button"
            aria-label="断开连接"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <path
                d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5M14 8l4 4-4 4M9 12h9"
              /></svg
            ><span class="toolbar-tooltip">断开连接</span>
          </button>
          <div class="toolbar-divider" role="separator"></div>
          <button
            class="toolbar-toggle"
            id="toolbar-toggle"
            type="button"
            aria-label="收起工具栏"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="m15 18-6-6 6-6" /></svg
            ><span class="toolbar-tooltip">收起</span>
          </button>
        </aside>
        <div class="status" id="status">
          <div>
            <strong id="status-title">正在建立安全连接</strong>
            <p id="status-detail">正在申请一次性连接票据…</p>
            <div class="status-actions" id="status-actions" hidden>
              <a href="/vnc">返回连接列表</a
              ><button class="primary" id="reconnect" type="button">
                重新连接
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
    <dialog id="clipboard-dialog">
      <strong>发送剪贴板文本</strong><textarea id="clipboard-text"></textarea>
      <div class="actions">
        <button id="clipboard-cancel">取消</button
        ><button class="primary" id="clipboard-send">发送</button>
      </div>
    </dialog>
    <script type="module">
      import RFB from "/vendor/novnc/core/rfb.js";
      const token = sessionStorage.getItem("remote-gateway-access-token") || "";
      const parameters = new URLSearchParams(location.search);
      const targetId = parameters.get("target") || "";
      document.querySelector("#disconnect").onclick = () =>
        location.replace("/vnc");
      if (!token || !targetId) {
        location.replace("/vnc");
        throw new Error("VNC target missing");
      }
      const response = await fetch("/api/vnc/sessions", {
        method: "POST",
        headers: {
          Authorization: `Bearer ${token}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ targetId }),
      });
      if (!response.ok) {
        document.querySelector("#status-title").textContent =
          "无法创建 VNC 会话";
        document.querySelector("#status-detail").textContent =
          response.status === 403
            ? "当前账户无权访问此设备。"
            : "目标设备不可用。";
        throw new Error(`VNC session failed: ${response.status}`);
      }
      const session = await response.json();
      const screen = document.querySelector("#screen"),
        status = document.querySelector("#status"),
        statusActions = document.querySelector("#status-actions");
      const scheme = location.protocol === "https:" ? "wss" : "ws";
      const wsUrl = new URL(
        session.websocketUrl,
        `${scheme}://${location.host}`,
      ).toString();
      const rfb = new RFB(screen, wsUrl, {
        credentials: { password: session.password || "" },
        shared: true,
      });
      rfb.scaleViewport = true;
      rfb.resizeSession = true;
      rfb.viewOnly = !!session.viewOnly;
      const viewButton = document.querySelector("#view-only");
      function setToggleState(button, enabled, label) {
        button.classList.toggle("active", enabled);
        button.querySelector(".toolbar-tooltip").textContent =
          `${label}：${enabled ? "开" : "关"}`;
      }
      setToggleState(viewButton, rfb.viewOnly, "只读");
      if (session.viewOnly) {
        viewButton.disabled = true;
        viewButton.title = "管理员已强制启用只读模式";
      }
      rfb.addEventListener("connect", () => {
        status.hidden = true;
        statusActions.hidden = true;
      });
      rfb.addEventListener("disconnect", (event) => {
        status.hidden = false;
        statusActions.hidden = false;
        document.querySelector("#status-title").textContent = event.detail.clean
          ? "连接已断开"
          : "连接意外中断";
        document.querySelector("#status-detail").textContent = event.detail
          .clean
          ? "可以返回设备列表重新连接。"
          : "请检查目标 VNC 服务和网络。";
      });
      rfb.addEventListener("securityfailure", (event) => {
        document.querySelector("#status-title").textContent =
          "VNC 身份验证失败";
        document.querySelector("#status-detail").textContent =
          event.detail.reason || "请检查设备密码。";
      });
      document.querySelector("#cad").onclick = () => rfb.sendCtrlAltDel();
      viewButton.onclick = () => {
        rfb.viewOnly = !rfb.viewOnly;
        setToggleState(viewButton, rfb.viewOnly, "只读");
      };
      document.querySelector("#fullscreen").onclick = () =>
        document.fullscreenElement
          ? document.exitFullscreen()
          : document.documentElement.requestFullscreen();
      document.querySelector("#reconnect").onclick = () => location.reload();
      const toolbar = document.querySelector("#remote-toolbar"),
        toolbarToggle = document.querySelector("#toolbar-toggle");
      toolbarToggle.onclick = () => {
        const collapsed = toolbar.classList.toggle("collapsed");
        toolbarToggle.setAttribute(
          "aria-label",
          collapsed ? "展开工具栏" : "收起工具栏",
        );
        toolbarToggle.querySelector(".toolbar-tooltip").textContent = collapsed
          ? "展开"
          : "收起";
      };
      const dialog = document.querySelector("#clipboard-dialog"),
        text = document.querySelector("#clipboard-text");
      document.querySelector("#clipboard").onclick = () => dialog.showModal();
      document.querySelector("#clipboard-cancel").onclick = () =>
        dialog.close();
      document.querySelector("#clipboard-send").onclick = () => {
        rfb.clipboardPasteFrom(text.value);
        dialog.close();
      };
      window.addEventListener("beforeunload", () => rfb.disconnect());
    </script>
  </body>
</html>
