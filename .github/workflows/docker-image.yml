name: Build RemoteLink Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration
        run: REMOTELINK_ADMIN_PASSWORD=ci-test-password docker compose config --quiet
      - name: Resolve image metadata
        id: meta
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            version="$(tr -d '[:space:]' < VERSION)-${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "local_image=remotelink-ci:${version}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/remotelink" >> "$GITHUB_OUTPUT"
          echo "dockerhub_image=${DOCKERHUB_USERNAME,,}/remotelink" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: |
            REMOTELINK_VERSION=${{ steps.meta.outputs.version }}
            REMOTELINK_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.local_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test image
        env:
          IMAGE: ${{ steps.meta.outputs.local_image }}
        run: |
          docker volume create remotelink-smoke-state >/dev/null
          docker run -d --name remotelink-smoke \
            -p 127.0.0.1:18080:18080 -v remotelink-smoke-state:/var/lib/remotelink \
            -e REMOTELINK_ADMIN_PASSWORD=ci-test-password "$IMAGE"
          trap 'docker rm -f remotelink-smoke >/dev/null 2>&1 || true; docker volume rm remotelink-smoke-state >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl -kfsS https://127.0.0.1:18080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -kfsS https://127.0.0.1:18080/healthz
          curl -kfsS https://127.0.0.1:18080/settings | grep -q 'Guacamole 专属'
          docker exec remotelink-smoke sh -c 'test -s /tmp/remotelink-guacd.pid && kill -0 "$(cat /tmp/remotelink-guacd.pid)"'
          docker exec remotelink-smoke sh -c 'command -v gs >/dev/null && printf "%s\n" "%!PS" "/Times-Roman findfont 18 scalefont setfont" "72 720 moveto (RemoteLink print test) show" "showpage" | gs -q -dNOPAUSE -dBATCH -dSAFER -sDEVICE=pdfwrite -sOutputFile=/tmp/print-smoke.pdf - && test -s /tmp/print-smoke.pdf && head -c 5 /tmp/print-smoke.pdf | grep -q "%PDF-"'
          docker logs remotelink-smoke
      - name: Validate Docker Hub credentials
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [[ -n "$DOCKERHUB_USERNAME" ]] || { echo "Missing DOCKERHUB_USERNAME secret" >&2; exit 1; }
          [[ -n "$DOCKERHUB_TOKEN" ]] || { echo "Missing DOCKERHUB_TOKEN secret" >&2; exit 1; }
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish release images
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            REMOTELINK_VERSION=${{ steps.meta.outputs.version }}
            REMOTELINK_REVISION=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.ghcr_image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.ghcr_image }}:latest
            ${{ steps.meta.outputs.dockerhub_image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.dockerhub_image }}:latest
          cache-from: type=gha
