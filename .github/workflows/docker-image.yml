name: Build RemoteLink Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then version="0.3.0-${GITHUB_SHA::7}"; fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/remotelink" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          build-args: REMOTELINK_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:latest', steps.meta.outputs.image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
        run: |
          docker run -d --name remotelink-smoke -p 127.0.0.1:18080:18080 \
            -e REMOTELINK_ADMIN_PASSWORD=ci-test-password "$IMAGE"
          trap 'docker rm -f remotelink-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs remotelink-smoke
          exit 1
