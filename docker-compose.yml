services:
  remotelink:
    image: remotelink:latest
    build:
      context: .
      args:
        REMOTELINK_VERSION: ${REMOTELINK_VERSION:-dev}
    restart: unless-stopped
    ports:
      - "18080:18080"
    environment:
      REMOTELINK_ADMIN_PASSWORD: ${REMOTELINK_ADMIN_PASSWORD:?set REMOTELINK_ADMIN_PASSWORD}
      REMOTELINK_BEHIND_TLS_PROXY: "1"
      REMOTELINK_ALLOWED_HOSTS: ${REMOTELINK_ALLOWED_HOSTS:-*}
    volumes:
      - remotelink-state:/var/lib/remotelink

volumes:
  remotelink-state:
