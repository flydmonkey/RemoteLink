services:
  remotelink:
    image: ${REMOTELINK_IMAGE:-flydmonkey/remotelink}:${REMOTELINK_VERSION:-latest}
    build:
      context: .
      args:
        REMOTELINK_VERSION: ${REMOTELINK_VERSION:-dev}
    restart: unless-stopped
    ports:
      - "18080:18080"
      - "50000-50019:50000-50019/udp"
    environment:
      REMOTELINK_ADMIN_PASSWORD: ${REMOTELINK_ADMIN_PASSWORD:?set REMOTELINK_ADMIN_PASSWORD}
      REMOTELINK_ALLOWED_HOSTS: ${REMOTELINK_ALLOWED_HOSTS:-*}
      REMOTELINK_TLS_CERTIFICATE: /etc/remotelink/tls/fullchain.pem
      REMOTELINK_TLS_PRIVATE_KEY: /etc/remotelink/tls/privkey.pem
      REMOTELINK_ICE_UDP_PORT_MIN: "50000"
      REMOTELINK_ICE_UDP_PORT_MAX: "50019"
      REMOTELINK_ICE_ADVERTISED_ADDRESS: ${REMOTELINK_ICE_ADVERTISED_ADDRESS:-}
    volumes:
      - remotelink-state:/var/lib/remotelink

volumes:
  remotelink-state:
